name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web-admin/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install admin dependencies
        run: npm ci
        working-directory: web-admin

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Create test database
        run: psql postgresql://ci:ci@localhost:5432/ci -c 'CREATE DATABASE ci_test'

      - name: Verify mobile, backend and admin
        run: npm run verify:all

      - name: Validate Prisma schema and migrations
        run: npx prisma validate
        working-directory: backend
