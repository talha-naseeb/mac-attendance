  <!-- Architectural M Pillars inside Badge -->
  <path d="M552 1296V1170C552 1158.95 560.954 1150 572 1150C579.4 1150 586.1 1154 589.6 1160.1L642 1254L694.4 1160.1C697.9 1154 704.6 1150 712 1150C723.046 1150 732 1158.95 732 1170V1296" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

