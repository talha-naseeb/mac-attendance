  </text>

  <!-- Subtitle: MACQUIRES PEOPLE -->
  <text x="642" y="1548" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="8">
