      <stop offset="0%" stop-color="#001629"/>
      <stop offset="100%" stop-color="#002C52"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="482" y1="1060" x2="802" y2="1380" gradientUnits="userSpaceOnUse">
