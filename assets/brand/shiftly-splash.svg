<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 2778" width="1284" height="2778" fill="none">
  <!-- Deep Background -->
  <rect width="1284" height="2778" fill="#001629"/>

  <!-- Center Icon and Lockup -->
  <g transform="translate(482, 1100)">
    <rect width="320" height="320" rx="72" fill="#002C52" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
    <g transform="translate(20, 20) scale(1.4)">
      
    <!-- Top-Left Navy Wing -->
    <path
      d="M 88 31
         L 113 31
         L 68 76
         L 68 96
         L 54 96
         C 38 96, 32 86, 40 74
         L 88 31 Z"
      fill="#0F4C7A"
    />

    <!-- Bottom-Right Navy Wing (180° symmetry) -->
    <path
      d="M 112 169
         L 87 169
         L 132 124
         L 132 104
         L 146 104
         C 162 104, 168 114, 160 126
         L 112 169 Z"
      fill="#0F4C7A"
    />

    <!-- Upper White Slash -->
    <polygon
      points="173,14  148,14  64,100  89,100"
      fill="#FFFFFF"
    />

    <!-- Lower White Slash -->
    <polygon
      points="111,104  136,104  52,190  27,190"
      fill="#FFFFFF"
    />

    <!-- Vibrant Orange Pulse Beacon -->
    <circle cx="140" cy="83" r="11" fill="#FE5800" />
    
    </g>
  </g>

  <text x="642" y="1520" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="-2.5">
    <tspan fill="#FFFFFF">Shift</tspan><tspan fill="#FE5800">ly</tspan>
  </text>
  <text x="642" y="1568" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" letter-spacing="4">
    SMART ATTENDANCE
  </text>
</svg>